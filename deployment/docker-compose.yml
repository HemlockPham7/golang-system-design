version: '3.7'

services:
    redis:
      image: redis:alpine
      container_name: redis
      ports:
        - "6379:6379"
    bookmark_service:
      image: bookmark-service:dev
      build: .
      restart: always
      container_name: bookmark-service
      ports:
        - "8080:8080"
      depends_on:
        - redis
      environment:
        - REDIS_ADDR=redis:6379
        - BASE_PATH=/api/bookmark_service

    nginx:
      image: nginx:alpine
      container_name: nginx
      ports:
        - "80:80"
      volumes:
        - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:Z