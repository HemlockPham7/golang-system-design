version: '3.7'

services:
    redis:
      image: redis:alpine
      container_name: redis

    bookmark-service:
      image: hemlockpham/bookmark-service:v1.0.6
      restart: always
      container_name: bookmark-service
      depends_on:
        - redis
      env_file:
        - ./bookmark-service/.env

    portal:
      image: ebvn/bookmark-app-portal:mono
      container_name: portal

    nginx:
      image: nginx:alpine
      container_name: nginx
      ports:
        - "80:80"
      volumes:
        - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:Z