basePath: /
definitions:
  handler.shortenInputBody:
    properties:
      exp:
        minimum: 60
        type: integer
      url:
        type: string
    required:
    - exp
    - url
    type: object
  model.HealthCheckResponse:
    properties:
      instance_id:
        type: string
      message:
        type: string
      service_name:
        type: string
    type: object
info:
  contact: {}
  description: API for managing bookmarks
  title: Bookmark Management API
  version: 1.0.0
paths:
  /genpass:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Generate a random password
      tags:
      - password
  /health-check:
    get:
      consumes:
      - application/json
      description: ping and pong with redis server
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.HealthCheckResponse'
      summary: check redis health
      tags:
      - health-check
  /v1/links/redirect/{code}:
    get:
      consumes:
      - application/json
      parameters:
      - description: Shorten code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Found
      tags:
      - link
  /v1/links/shorten:
    post:
      consumes:
      - application/json
      description: Generate shorten url based on original url that last upto 7 days
      parameters:
      - description: Input required
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handler.shortenInputBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Generate shorten url based on original url that last upto 7 days
      tags:
      - link
swagger: "2.0"
