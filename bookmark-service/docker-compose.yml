version: '3.7'

services:
    redis:
      image: redis:alpine
      container_name: redis
      ports:
        - "6379:6379"
    bookmark_service:
      image: bookmark-service-test:latest
      build: .
      container_name: bookmark-service
      ports:
        - "8080:8080"
      depends_on:
        - redis
      environment:
        - REDIS_ADDR=redis:6379