version: '3.7'

services:
    redis:
      image: redis:alpine
      container_name: redis
      ports:
        - "6379:6379"

    bookmark-service:
      image: hemlockpham/bookmark-service:latest
      build: .
      container_name: bookmark-service
      depends_on:
        - redis
      ports:
        - "8080:8080"
      env_file:
        - .env

    postgres:
      image: postgres:17
      container_name: postgres
      ports:
        - "5432:5432"
      environment:
        POSTGRES_USER: admin
        POSTGRES_PASSWORD: admin
        POSTGRES_DB: bookmark
        TZ: Asia/Ho_Chi_Minh