name: cd-pipeline
on:
  workflow_run:
    workflows: ["ci-pipeline"]
    types:
      - completed

jobs:
  cd_pipeline:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch != 'main'
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Create .env file
        run: |
          mkdir -p ./deployment/bookmark-service
          echo "${{ secrets.BOOKMARK_SERVICE_ENV }}" > ./deployment/bookmark-service/.env

      - name: login to docker
        working-directory: ./bookmark-service
        run: make docker-login
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Deploy Application
        working-directory: ./deployment
        run: |
          echo "Deploying application..."
          
          mkdir -p ./bookmark-service
          echo "$ENV_CONTENT" > ./bookmark-service/.env
          
          docker compose pull
          docker compose up -d --remove-orphans
          docker system prune -f
        env:
          ENV_CONTENT: ${{ secrets.BOOKMARK_SERVICE_ENV }}